# One instance: docker compose up --build
# Optional replicas: docker compose up --build --scale app=3
# Override both ends of the host range together:
# APP_PORT=18080 APP_PORT_MAX=18082 POSTGRES_PORT=15432 docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airline?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: airline
      SPRING_DATASOURCE_PASSWORD: airline
    ports:
      - "${APP_PORT:-8080}-${APP_PORT_MAX:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
volumes:
  postgres-data:
