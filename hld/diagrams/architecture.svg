<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
  <title id="title">Airline reservation architecture</title>
  <desc id="desc">Clients call stateless Spring Boot replicas. Controllers use service interfaces; implementations use flat JPA repositories and isolated read/write connection pools. All replicas share PostgreSQL constraints and Flyway migrations.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#334155"/></marker></defs>
  <rect width="880" height="350" fill="#f8fafc"/>
  <g fill="#e2e8f0" stroke="#334155" stroke-width="2">
    <rect x="20" y="135" width="150" height="65" rx="8"/>
    <rect x="230" y="40" width="350" height="115" rx="8"/>
    <rect x="230" y="205" width="350" height="115" rx="8"/>
    <rect x="660" y="125" width="195" height="85" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="95" y="162">Customer / admin</text><text x="95" y="184">HTTP clients</text>
    <text x="405" y="67">Spring Boot replica A</text>
    <text x="405" y="97">Service contracts / implementations</text>
    <text x="405" y="127">Flat JPA - read 5 / write 10</text>
    <text x="405" y="232">Optional Spring Boot replica B</text>
    <text x="405" y="262">Same stateless application</text>
    <text x="405" y="292">No JVM-local inventory locks</text>
    <text x="758" y="153">PostgreSQL primary</text>
    <text x="758" y="178">Active-seat unique index</text>
    <text x="758" y="200">Flyway-owned schema</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M170,155 L230,100"/><path d="M170,180 L230,250"/>
    <path d="M580,100 L660,145"/><path d="M580,250 L660,190"/>
  </g>
</svg>
