spring:
  application:
    name: airline-reservation
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline?reWriteBatchedInserts=true}
    username: ${SPRING_DATASOURCE_USERNAME:airline}
    password: ${SPRING_DATASOURCE_PASSWORD:airline}
    hikari:
      pool-name: airline-write-pool
      # Size the combined pools of all replicas below the database connection limit.
      maximum-pool-size: 10
      connection-timeout: 20000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{instanceId:-local}/%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.airline.reservation: INFO
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

airline:
  booking:
    window-days: 365
  datasource:
    read:
      maximum-pool-size: 5
      connection-timeout-ms: 250
      statement-timeout-ms: 500
      lock-timeout-ms: 250
